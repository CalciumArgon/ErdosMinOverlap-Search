<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erdős v4 搜索报告</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab-notebook report. Prose in a ~72ch reading column; charts and the
   full node table run in wider bands. Chain roles carry color: amber = explore,
   teal = exploit, grey = reference. */
:root {
  --paper: #F4F6F8; --panel: #FFFFFF; --ink: #18212B; --muted: #5B6876; --rule: #D5DBE2;
  --accent: #2B5C9C; --explore: #B4691A; --exploit: #127566; --ref: #7B8794;
  --good: #1F7A3A; --bad: #B42318; --hl: #E7EEF8;
  --f-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --s-1: 0.8125rem; --s0: 1rem; --s1: 1.25rem; --s2: 1.6rem; --s3: 2.25rem;
  --col: 72ch; --wide: 1180px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0E1318; --panel: #151C23; --ink: #E4E9EF; --muted: #98A4B2; --rule: #2A333D;
  --accent: #8DB0E8; --explore: #E3A35A; --exploit: #4FC1AE; --ref: #A3AEBA;
  --good: #5CC67A; --bad: #F0857A; --hl: #1C2733; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0E1318; --panel: #151C23; --ink: #E4E9EF; --muted: #98A4B2; --rule: #2A333D;
  --accent: #8DB0E8; --explore: #E3A35A; --exploit: #4FC1AE; --ref: #A3AEBA;
  --good: #5CC67A; --bad: #F0857A; --hl: #1C2733; color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--s0)/1.75 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 2.5rem 4rem; }
main { max-width: var(--wide); margin: 0 auto; display: grid; gap: 3.5rem; }
section { display: grid; gap: 1.1rem; min-width: 0; }
.prose { max-width: var(--col); display: grid; gap: 0.9rem; min-width: 0; }
.prose p, .prose li { margin: 0; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3rem; display: grid; gap: 0.4rem; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.3; margin: 0; text-wrap: balance; }
h1 { font-size: var(--s3); }
h2 { font-size: var(--s2); padding-top: 0.6rem; border-top: 1px solid var(--rule); }
h3 { font-size: var(--s1); font-weight: 600; }
.eyebrow { font: 600 var(--s-1)/1.4 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.lede { font-size: 1.08rem; color: var(--ink); max-width: var(--col); margin: 0; }
.muted { color: var(--muted); }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
code { font-family: var(--f-mono); font-size: 0.92em; background: var(--hl); padding: 0.05em 0.3em; border-radius: 3px; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, summary:focus-visible, th:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.math { font-family: var(--f-mono); font-size: 0.95em; white-space: nowrap; }
.display-math { font-family: var(--f-mono); background: var(--panel); border: 1px solid var(--rule);
  padding: 0.7rem 1rem; overflow-x: auto; white-space: pre; line-height: 1.6; font-size: 0.92rem; }
.verdict { border-left: 4px solid var(--accent); background: var(--panel); padding: 0.9rem 1.1rem; display: grid; gap: 0.5rem; }
.verdict.warn { border-left-color: var(--explore); }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px;
  background: var(--rule); border: 1px solid var(--rule); }
.figure { background: var(--panel); padding: 0.9rem 1rem; display: grid; gap: 0.15rem; min-width: 0; }
.figure .label { font-size: var(--s-1); color: var(--muted); }
.figure .value { font: 600 1.35rem/1.25 var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.figure .note { font-size: var(--s-1); color: var(--muted); }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); background: var(--panel); max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
th { font-weight: 600; background: var(--panel); color: var(--muted); white-space: nowrap; }
td.num, th.num { text-align: right; white-space: nowrap; }
tbody tr:hover td { background: var(--hl); }
.big-table { max-height: 78vh; }
.big-table th { position: sticky; top: 0; z-index: 1; cursor: pointer; user-select: none; }
.big-table th[aria-sort="ascending"]::after { content: " ▲"; }
.big-table th[aria-sort="descending"]::after { content: " ▼"; }
.chip { display: inline-block; font: 600 0.72rem/1.6 var(--f-mono); padding: 0 0.45em; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; }
.chip.explore { color: var(--explore); } .chip.exploit { color: var(--exploit); } .chip.root { color: var(--ref); }
.chip.ok { color: var(--good); } .chip.bad { color: var(--bad); }
.better { color: var(--good); font-weight: 600; } .worse { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.controls button { font: 500 var(--s-1)/1 var(--f-body); padding: 0.45rem 0.7rem; border: 1px solid var(--rule);
  background: var(--panel); color: var(--ink); border-radius: 4px; cursor: pointer; }
.controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--hl); }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 1.25rem; }
.chart { background: var(--panel); border: 1px solid var(--rule); padding: 0.9rem 1rem 1rem; display: grid; gap: 0.5rem; min-width: 0; }
.chart h3 { font-size: 1.02rem; }
.chart .canvas-box { position: relative; height: 300px; }
.chart .caption { font-size: var(--s-1); color: var(--muted); margin: 0; }
details { background: var(--panel); border: 1px solid var(--rule); padding: 0.6rem 0.9rem; }
details > summary { cursor: pointer; font-weight: 500; }
.refl { font-size: 0.8rem; color: var(--muted); max-width: 46ch; white-space: pre-wrap; }
.toc { display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; font-size: var(--s-1); }
@media (max-width: 640px) { h1 { font-size: 1.75rem; } h2 { font-size: 1.35rem; } .chart .canvas-box { height: 240px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
